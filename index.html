<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SO Point Coffee App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>
  :root { --bg-main: #f4f6f9; --primary: #2563eb; --primary-light: #eff6ff; --danger: #ef4444; --dark-green: #1b4d2e; --text-main: #1e293b; --text-muted: #64748b; --card-bg: #ffffff; --yellow-input: #fef08a; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
  .app-frame { width: 100%; max-width: 480px; background: var(--bg-main); min-height: 100vh; padding-bottom: 90px; }
  .header-user { padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
  .user-info { display: flex; align-items: center; gap: 12px; }
  .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--dark-green); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
  .card { background: var(--card-bg); margin: 12px 20px; padding: 18px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
  .card-title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .input-row input { background: var(--yellow-input); border: 1.5px solid #fde047; padding: 8px 12px; border-radius: 12px; font-size: 16px; font-weight: 700; width: 110px; text-align: right; outline: none; }
  .tab-content { display: none; } .tab-content.active { display: block; }
  .katalog-accordion { display: flex; flex-direction: column; gap: 12px; padding: 0 20px; }
  .category-group { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; }
  .category-header { background: var(--dark-green); color: #fff; padding: 14px 18px; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .category-content { display: none; padding: 12px; background: #fff; flex-direction: column; gap: 8px; }
  .category-group.open .category-content { display: flex; }
  .plu-card { background: var(--bg-main); padding: 12px 14px; border-radius: 12px; display: flex; justify-content: space-between; }
  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #ffffff; display: flex; justify-content: space-around; padding: 10px 0 16px; border-radius: 24px 24px 0 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.05); z-index: 99; }
  .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 11px; cursor: pointer; border: none; background: none; flex: 1; }
  .nav-item.active { color: var(--primary); font-weight: 700; }
  .nav-item-center { width: 48px; height: 48px; background: var(--primary); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; margin-top: -24px; cursor: pointer; border: none; }
</style>
</head>
<body>

<div class="app-frame" id="appFrame">
  <div class="header-user">
    <div class="user-info"><div class="user-avatar">PC</div><div><h3>Point Coffee SO</h3></div></div>
    <button class="btn-admin" onclick="alert('Admin Mode')"><i class="ri-user-settings-line"></i> Admin</button>
  </div>

  <div id="tabKalkulator" class="tab-content active">
    <div class="card">
        <div class="card-title">Input SO Gramasi</div>
        <div class="input-row"><label>Timbangan</label><input type="number" id="timbanganGramasi" oninput="hitungGramasi()"></div>
        <table id="tabelGramasi"><thead><tr><th>WADAH</th><th>TARE</th><th>MJ</th><th>BERSIH</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card">
        <div class="card-title">SO Biang Kopi</div>
        <div class="input-row"><label>Timbangan</label><input type="number" id="biangTimbangan" oninput="hitungBiang()"></div>
        <div class="input-row"><label>Botol</label><input type="number" id="biangBotol" oninput="hitungBiang()"></div>
        <div class="input-row"><span>Netto</span><span id="resNetto">0</span></div>
        <div class="input-row"><span>Kopi</span><span id="resKopi">0</span></div>
    </div>
  </div>

  <div id="tabKatalog" class="tab-content">
    <div id="katalogAccordion" class="katalog-accordion"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchNav('tabKalkulator', this)"><i class="ri-calculator-line"></i><span>Gramasi</span></button>
    <button class="nav-item-center" onclick="refreshAll()"><i class="ri-refresh-line"></i></button>
    <button class="nav-item" onclick="switchNav('tabKatalog', this)"><i class="ri-database-2-line"></i><span>Katalog</span></button>
  </div>
</div>

<script>
  const BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTh44Pn8778u8iW9A9QA1UyYeHj_zO2RQET5gUlhPpua48_MA6XCy0HY6zKAeOGpS9UdT8ogPkzvKo0/pub?output=csv';
  let ratioBijiKopi = 0.3;

  function switchNav(id, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  function parseCSV(text) { return text.split('\n').map(row => row.split(',')); }

  function refreshAll() {
    // 1. Ambil data katalog murni (filter ketat agar tidak ambil data kalkulator)
    fetch(`${BASE_URL}&t=${Date.now()}`)
      .then(r => r.text()).then(csv => {
        const rows = parseCSV(csv);
        const container = document.getElementById('katalogAccordion');
        container.innerHTML = '';
        let currentCat = "BARANG";
        
        rows.forEach(row => {
          const col0 = (row[0]||'').toUpperCase();
          // FILTER: Abaikan semua baris yang mengandung keyword kalkulator
          if(col0.includes('KALKULATOR') || col0.includes('TIMBANGAN') || col0.includes('NETTO') || col0.includes('WADAH')) return;
          if(col0.length > 0 && !row[1]) { currentCat = col0; return; }
          
          container.innerHTML += `<div class="category-group"><div class="category-header">${currentCat}</div><div class="category-content" style="display:block"><div class="plu-card">${row[0]} - ${row[1]}</div></div></div>`;
        });
        alert("Data diperbarui!");
      });
  }

  function hitungBiang() {
    const net = parseFloat(document.getElementById('biangTimbangan').value) - parseFloat(document.getElementById('biangBotol').value);
    document.getElementById('resNetto').innerText = net || 0;
    document.getElementById('resKopi').innerText = Math.round(net * ratioBijiKopi);
  }

  refreshAll();
</script>
</body>
</html>
