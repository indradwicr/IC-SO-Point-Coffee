<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SO Point Coffee App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root { --bg-main: #f4f6f9; --primary: #2563eb; --dark-green: #1b4d2e; --text-main: #1e293b; --text-muted: #64748b; --card-bg: #ffffff; --yellow-input: #fef08a; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
  .app-frame { width: 100%; max-width: 480px; background: var(--bg-main); min-height: 100vh; padding-bottom: 90px; }
  .card { background: var(--card-bg); margin: 12px 20px; padding: 18px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
  .card-title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .input-row input { background: var(--yellow-input); border: 1.5px solid #fde047; padding: 8px 12px; border-radius: 12px; font-size: 16px; font-weight: 700; width: 110px; text-align: right; }
  .tab-content { display: none; } .tab-content.active { display: block; }
  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: #ffffff; display: flex; justify-content: space-around; padding: 15px 0; border-radius: 24px 24px 0 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.05); }
  .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--primary); font-size: 14px; cursor: pointer; border: none; background: none; }
</style>
</head>
<body>

<div class="app-frame">
  <div id="tabKalkulator" class="tab-content active">
    <div class="card">
      <div class="card-title"><i class="ri-scales-3-line"></i> Input SO Gramasi</div>
      <div class="input-row"><label>Berat Timbangan (gr)</label><input type="number" id="timbanganGramasi" oninput="hitungGramasi()"></div>
      <table id="tabelGramasi"><thead><tr><th>WADAH</th><th>TARE</th><th>MJ</th><th>BERSIH</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card">
      <div class="card-title"><i class="ri-cup-line"></i> SO Biang Kopi (Sync Tab: Kalkulator Biang)</div>
      <div class="input-row"><label>Total Timbangan</label><input type="number" id="biangTimbangan" oninput="hitungBiang()"></div>
      <div class="input-row"><label>Berat Botol Kosong</label><input type="number" id="biangBotol" oninput="hitungBiang()"></div>
      <div class="input-row"><span>Netto</span><span id="resNetto" style="font-weight:700">0</span></div>
      <div class="input-row"><span>Konversi Biji Kopi</span><span id="resKopi" style="font-weight:700">0</span></div>
    </div>
  </div>
  
  <div class="bottom-nav">
    <button class="nav-item" onclick="forceSync()"><i class="ri-refresh-line"></i><span>Klik Untuk Refresh Data</span></button>
  </div>
</div>

<script>
  const BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTh44Pn8778u8iW9A9QA1UyYeHj_zO2RQET5gUlhPpua48_MA6XCy0HY6zKAeOGpS9UdT8ogPkzvKo0/pub?output=csv';
  const GID_WADAH = '2064100982'; 
  const GID_BIANG = '1208855579';

  let ratioBiji = 0.3; // Default

  function parseCSV(text) {
    return text.split('\n').map(row => row.split(','));
  }

  async function forceSync() {
    // 1. Sync Wadah
    fetch(`${BASE_URL}&gid=${GID_WADAH}&nocache=${Date.now()}`)
      .then(r => r.text()).then(csv => {
        const rows = parseCSV(csv);
        const tbody = document.querySelector('#tabelGramasi tbody');
        tbody.innerHTML = '';
        rows.forEach(row => {
          if(row[0] && row[0].toUpperCase() !== 'NAMA WADAH' && row[0].toUpperCase() !== 'WADAH' && !row[0].includes('KALKULATOR')) {
            tbody.innerHTML += `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td id="hasil-${row[0]}">-</td></tr>`;
          }
        });
      });

    // 2. Sync Biang Kopi
    fetch(`${BASE_URL}&gid=${GID_BIANG}&nocache=${Date.now()}`)
      .then(r => r.text()).then(csv => {
        const rows = parseCSV(csv);
        // Baris 7: Konversi Biji (index 6, col 1), Netto (index 5, col 1) -> menyesuaikan urutan baris
        const netto = parseFloat(rows[5][1]) || 520;
        const kopi = parseFloat(rows[6][1]) || 156;
        ratioBiji = kopi / netto;
        alert("Data berhasil diperbarui dari Google Sheets!");
      });
  }

  function hitungBiang() {
    const netto = parseFloat(document.getElementById('biangTimbangan').value) - parseFloat(document.getElementById('biangBotol').value);
    document.getElementById('resNetto').innerText = netto || 0;
    document.getElementById('resKopi').innerText = Math.round(netto * ratioBiji) || 0;
  }

  // Auto-init
  forceSync();
</script>
</body>
</html>
