<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SO Point Coffee App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>
  :root {
    --bg-main: #f4f6f9;
    --primary: #2563eb;
    --dark-green: #1b4d2e;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --card-bg: #ffffff;
    --yellow-input: #fef08a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
  .app-frame { width: 100%; max-width: 480px; background: var(--bg-main); min-height: 100vh; padding-bottom: 90px; }
  .card { background: var(--card-bg); margin: 12px 20px; padding: 18px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
  .card-title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .input-row label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
  .input-row input { background: var(--yellow-input); border: 1.5px solid #fde047; padding: 8px 12px; border-radius: 12px; font-size: 16px; font-weight: 700; width: 110px; text-align: right; outline: none; }
  .bold { font-weight: 700; color: var(--text-main); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: #ffffff; display: flex; justify-content: space-around; padding: 10px 0 16px; border-radius: 24px 24px 0 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.05); z-index: 99; }
  .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 11px; cursor: pointer; border: none; background: none; }
  .nav-item.active { color: var(--primary); font-weight: 700; }
  .admin-only { display: none; }
  .is-admin .admin-only { display: block; }
</style>
</head>
<body>

<div class="app-frame" id="appFrame">
  <div id="tabKalkulator" class="tab-content active">
    <!-- Tabel Gramasi -->
    <div class="card">
      <div class="card-title"><i class="ri-scales-3-line"></i> Input SO Gramasi</div>
      <div class="input-row">
        <label>Berat Timbangan (gr)</label>
        <input type="number" id="timbanganGramasi" oninput="hitungGramasi()">
      </div>
      <table id="tabelGramasi"></table>
    </div>

    <!-- Kalkulator Biang Kopi Dinamis -->
    <div class="card">
      <div class="card-title"><i class="ri-cup-line"></i> SO Biang Kopi (Sync Sheets)</div>
      <div class="input-row">
        <label>Total Timbangan</label>
        <input type="number" id="biangTimbangan" oninput="hitungBiang()">
      </div>
      <div class="input-row">
        <label>Berat Botol Kosong</label>
        <input type="number" id="biangBotol" oninput="hitungBiang()">
      </div>
      <div style="background: var(--bg-main); padding: 12px; border-radius: 12px;">
        <div class="input-row"><span>Netto</span><span class="bold" id="resNetto">0</span></div>
        <div class="input-row"><span>Biji Kopi</span><span class="bold" id="resKopi">0</span></div>
        <div class="input-row"><span>Air Mineral</span><span class="bold" id="resAir">0</span></div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchNav('tabKalkulator', this)"><i class="ri-calculator-line"></i><span>Gramasi</span></button>
  </div>
</div>

<script>
  const SPREADSHEET_BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTh44Pn8778u8iW9A9QA1UyYeHj_zO2RQET5gUlhPpua48_MA6XCy0HY6zKAeOGpS9UdT8ogPkzvKo0/pub?output=csv';
  const GRAMASI_GID = '2064100982'; 

  // Variabel Global untuk Rasio Biang Kopi (diupdate dari Sheets)
  let ratioBijiKopi = 0.3; 
  let dataWadah = [];

  function loadGramasiFromSheets() {
    const url = SPREADSHEET_BASE_URL + '&gid=' + GRAMASI_GID + '&t=' + Date.now();
    fetch(url).then(res => res.text()).then(csvText => {
      const rows = parseCSV(csvText);
      let parsedWadah = [];
      
      rows.forEach(row => {
        const nama = (row[0] || '').trim();
        const val1 = parseFloat((row[1] || '0').replace(',', '.'));
        const val2 = parseFloat((row[2] || '1').replace(',', '.'));

        // Deteksi Baris Konversi (Biang Kopi)
        if (nama.toUpperCase().includes('KONVERSI BIJI KOPI')) {
            // Rasio = Konversi / Netto (Data di Sheets row 36: Netto 367, Konversi 110)
            ratioBijiKopi = val1 / 367; 
        }

        // Deteksi Baris Wadah
        if (nama && nama.toUpperCase() !== 'WADAH' && !nama.toUpperCase().includes('KALKULATOR') && !nama.toUpperCase().includes('INPUT')) {
          parsedWadah.push({ nama, tare: val1, mj: val2 });
        }
      });
      dataWadah = parsedWadah;
      hitungGramasi();
      hitungBiang();
    });
  }

  function hitungBiang() {
    const timbangan = parseFloat(document.getElementById('biangTimbangan').value) || 0;
    const botol = parseFloat(document.getElementById('biangBotol').value) || 0;
    const netto = Math.max(0, timbangan - botol);
    const kopi = Math.round(netto * ratioBijiKopi);
    document.getElementById('resNetto').innerText = netto;
    document.getElementById('resKopi').innerText = kopi;
    document.getElementById('resAir').innerText = netto - kopi;
  }

  // ... (fungsi hitungGramasi, parseCSV, dll tetap sama)
  
  loadGramasiFromSheets();
</script>
</body>
</html>
